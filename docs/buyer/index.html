<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1769C2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CW Buyer">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Crop-Waste Buyer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* style.css - all the styling of the app.
   Mobile first: the base rules are for phones, the @media blocks at the bottom are for tablet and laptop. */

:root {
  --g: #1fa547;
  --gd: #168a38;
  --gs: #e6f5ea;
  --bg: #ffffff;
  --page: #ffffff;
  color-scheme: light;
  --card: #ffffff;
  --soft: #f7f8f7;
  --line: #ebeeeb;
  --tx: #1d2a21;
  --mu: #6c7a70;
  --amber: #f5a623;
  --r: 16px;
  --w: 430px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
}
body {
  margin: 0;
  background: var(--page);
  color: var(--tx);
  font-family:
    "Poppins",
    system-ui,
    -apple-system,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
  min-height: 100%;
}
button {
  font-family: inherit;
  cursor: pointer;
  border: none;
}
input,
select {
  font-family: inherit;
  width: 100%;
  padding: 0.7rem 0.85rem;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  background: var(--soft);
  color: var(--tx);
  font-size: 0.88rem;
}
input:focus,
select:focus {
  outline: 2px solid var(--g);
  outline-offset: 0;
  border-color: transparent;
}
label {
  display: block;
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--mu);
  margin: 0.7rem 0 0.25rem;
}
/* ---------- main wrapper ---------- */
.app {
  max-width: var(--w);
  margin: 0 auto;
  background: var(--bg);
  min-height: 100vh;
  position: relative;
  box-shadow: 0 0 30px rgba(0, 0, 0, 0.05);
}
/* header */
/* ---------- header ---------- */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--bg);
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.8rem 1rem;
  border-bottom: 1px solid var(--line);
}
.back {
  background: var(--soft);
  color: var(--tx);
  width: 34px;
  height: 34px;
  border-radius: 50%;
  font-size: 1.1rem;
  display: none;
}
.loc {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  background: none;
  color: var(--tx);
  text-align: left;
  padding: 0;
}
.loc .pin {
  font-size: 1.1rem;
  color: var(--g);
}
.loc b {
  font-size: 0.92rem;
  display: block;
  line-height: 1.1;
}
.loc small {
  font-size: 0.66rem;
  color: var(--mu);
  display: block;
}
.top-r {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.seg {
  display: flex;
  background: var(--soft);
  border-radius: 20px;
  padding: 2px;
}
.seg button {
  background: none;
  color: var(--mu);
  padding: 0.3rem 0.7rem;
  border-radius: 18px;
  font-size: 0.7rem;
  font-weight: 600;
}
.seg button.on {
  background: var(--g);
  color: #fff;
}
.round {
  position: relative;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--g);
  color: #fff;
  font-size: 1rem;
}
.round i {
  position: absolute;
  top: -3px;
  right: -3px;
  min-width: 17px;
  height: 17px;
  border-radius: 9px;
  background: var(--amber);
  color: #3a2800;
  font-size: 0.62rem;
  font-style: normal;
  font-weight: 700;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 0 3px;
}
/* screens */
/* ---------- screens ---------- */
.screen {
  display: none;
  padding: 1rem 1rem 7.5rem;
  animation: in 0.22s ease;
}
.screen.on {
  display: block;
}
@keyframes in {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
h3 {
  font-size: 1rem;
  margin: 1.2rem 0 0.7rem;
  font-weight: 700;
}
h3:first-child {
  margin-top: 0;
}
.hi {
  font-size: 0.8rem;
  color: var(--mu);
  margin: 0 0 0.6rem;
}
/* ---------- home: banner and category tiles ---------- */
.banner {
  border-radius: 20px;
  padding: 1.1rem 1rem;
  color: #fff;
  position: relative;
  overflow: hidden;
  min-height: 128px;
  background: linear-gradient(120deg, #17863a, #31b957 60%, #7bd36b);
}
.banner:before {
  content: "";
  position: absolute;
  right: -30px;
  top: -30px;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.14);
}
.banner .tag {
  display: inline-block;
  background: var(--amber);
  color: #3a2800;
  font-size: 0.62rem;
  font-weight: 700;
  padding: 0.15rem 0.55rem;
  border-radius: 10px;
  letter-spacing: 0.04em;
}
.banner h2 {
  margin: 0.45rem 0 0.15rem;
  font-size: 1.55rem;
  line-height: 1.05;
  font-weight: 700;
  max-width: 60%;
}
.banner p {
  margin: 0 0 0.7rem;
  font-size: 0.72rem;
  opacity: 0.92;
  max-width: 58%;
}
.banner .cta {
  background: #fff;
  color: var(--gd);
  font-weight: 700;
  font-size: 0.74rem;
  padding: 0.4rem 0.9rem;
  border-radius: 16px;
}
.banner .art {
  position: absolute;
  right: 0.7rem;
  bottom: 0.5rem;
  font-size: 4.4rem;
  filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.2));
}
.grid3 {
  display: flex;
  flex-wrap: wrap;
  gap: 0.6rem;
}
.tile {
  border-radius: 16px;
  padding: 0.7rem 0.3rem 0.55rem;
  text-align: center;
  color: #33403a;
  display: block;
  flex: 0 0 calc(33.333% - 0.4rem);
  transition: transform 0.12s;
}
.tile:active {
  transform: scale(0.95);
}
.tile .em {
  font-size: 2.1rem;
  display: block;
  margin-bottom: 0.15rem;
}
.tile span {
  font-size: 0.58rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.quick {
  display: flex;
  flex-wrap: wrap;
  gap: 0.6rem;
  margin-top: 0.9rem;
}
.quick .qcard {
  flex: 1 1 calc(50% - 0.3rem);
  min-width: 0;
}
.qcard {
  background: var(--gs);
  border-radius: 14px;
  padding: 0.7rem 0.8rem;
  text-align: left;
  color: var(--tx);
}
.qcard b {
  display: block;
  font-size: 0.95rem;
  color: var(--gd);
}
.qcard small {
  font-size: 0.65rem;
  color: var(--mu);
}

.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
}
.link {
  background: none;
  color: var(--g);
  font-size: 0.75rem;
  font-weight: 600;
  padding: 0;
}
/* listing cards */
/* ---------- listing / request cards ---------- */
.item {
  display: flex;
  gap: 0.7rem;
  align-items: center;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 0.65rem;
  margin-bottom: 0.65rem;
}
.thumb {
  width: 58px;
  height: 58px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.9rem;
  flex-shrink: 0;
  overflow: hidden;
}
.thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.imid {
  flex: 1;
  min-width: 0;
}
.imid b {
  font-size: 0.88rem;
  display: block;
}
.imid small {
  display: block;
  font-size: 0.68rem;
  color: var(--mu);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.imid .meta {
  font-size: 0.7rem;
  margin-top: 0.15rem;
  color: var(--tx);
}
.imid .meta em {
  font-style: normal;
  color: var(--g);
  font-weight: 700;
}
.acts {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  align-items: center;
}
.cbtn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--bg);
  color: var(--g);
  border: 1.5px solid var(--g);
  font-size: 0.85rem;
}
.pbtn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--g);
  color: #fff;
  font-size: 1.15rem;
  line-height: 1;
}
.pill {
  font-size: 0.62rem;
  font-weight: 700;
  padding: 0.18rem 0.55rem;
  border-radius: 10px;
  background: var(--gs);
  color: var(--gd);
  white-space: nowrap;
}
.pill.amb {
  background: #fff1d6;
  color: #8a5a00;
}
.pill.gry {
  background: var(--soft);
  color: var(--mu);
}
.obtn {
  background: var(--g);
  color: #fff;
  border-radius: 14px;
  padding: 0.38rem 0.8rem;
  font-size: 0.7rem;
  font-weight: 600;
}
.card.empty {
  text-align: center;
  color: var(--mu);
  font-size: 0.8rem;
}
.card.empty .btn {
  width: auto;
  margin-top: 0.7rem;
  padding: 0.55rem 1.1rem;
}

/* market controls */
/* ---------- market filters ---------- */
.chips {
  display: flex;
  gap: 0.45rem;
  overflow-x: auto;
  padding: 0.1rem 0 0.7rem;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar {
  display: none;
}
.chip {
  white-space: nowrap;
  background: var(--soft);
  color: var(--tx);
  font-size: 0.72rem;
  font-weight: 600;
  padding: 0.4rem 0.85rem;
  border-radius: 18px;
  border: 1.5px solid transparent;
}
.chip.on {
  background: var(--gs);
  color: var(--gd);
  border-color: var(--g);
}
.search {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  background: var(--soft);
  border-radius: 14px;
  padding: 0 0.8rem;
  margin-bottom: 0.7rem;
}
.search input {
  border: none;
  background: none;
  padding: 0.7rem 0;
}
.search input:focus {
  outline: none;
}
.catfab-wrap {
  position: fixed;
  bottom: calc(74px + env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translateX(-50%);
  width: min(100%, var(--w));
  padding: 0 1rem;
  pointer-events: none;
  z-index: 15;
  display: none;
}
.catfab {
  pointer-events: auto;
  background: #17211a;
  color: #fff;
  font-size: 0.78rem;
  font-weight: 600;
  padding: 0.6rem 1rem;
  border-radius: 22px;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
}
/* bottom nav */
/* ---------- bottom menu ---------- */
nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: min(100%, var(--w));
  background: var(--card);
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-around;
  align-items: flex-end;
  padding: 0.45rem 0.3rem calc(0.45rem + env(safe-area-inset-bottom, 0px));
  z-index: 30;
}
nav button {
  background: none;
  color: var(--mu);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.1rem;
  font-size: 0.6rem;
  font-weight: 600;
  min-width: 58px;
}
nav button .ic {
  font-size: 1.25rem;
  filter: grayscale(1);
  opacity: 0.7;
}
nav button.on {
  color: var(--g);
}
nav button.on .ic {
  filter: none;
  opacity: 1;
}
nav .fab {
  background: var(--g);
  color: #fff;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  font-size: 1.7rem;
  margin-top: -22px;
  box-shadow: 0 6px 14px rgba(31, 165, 71, 0.45);
  min-width: 52px;
  justify-content: center;
}
nav .fab .ic {
  filter: none;
  opacity: 1;
  font-size: 1.6rem;
}
/* cards, stats */
/* ---------- cards, buttons, stats ---------- */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 0.9rem;
  margin-bottom: 0.8rem;
}
.btn {
  background: var(--g);
  color: #fff;
  font-weight: 600;
  font-size: 0.85rem;
  padding: 0.75rem 1rem;
  border-radius: 14px;
  width: 100%;
  margin-top: 0.9rem;
}
.btn.ghost {
  background: var(--gs);
  color: var(--gd);
}
.btn.sm {
  width: auto;
  margin: 0;
  padding: 0.45rem 0.9rem;
  font-size: 0.72rem;
  border-radius: 12px;
}
.stats {
  display: flex;
  gap: 0.5rem;
}
.stat {
  flex: 1;
  min-width: 0;
  background: var(--gs);
  border-radius: 12px;
  padding: 0.6rem 0.3rem;
  text-align: center;
}
.stat b {
  display: block;
  font-size: 1rem;
  color: var(--gd);
}
.stat small {
  font-size: 0.6rem;
  color: var(--mu);
}

.g2 {
  display: flex;
  flex-wrap: wrap;
  gap: 0.6rem;
}
.g2 > * {
  flex: 1 1 calc(50% - 0.3rem);
  min-width: 0;
}
.prev {
  display: none;
  width: 100%;
  max-height: 150px;
  object-fit: cover;
  border-radius: 12px;
  margin-top: 0.5rem;
}
.note {
  background: var(--gs);
  border-left: 3px solid var(--g);
  border-radius: 8px;
  padding: 0.5rem 0.7rem;
  font-size: 0.72rem;
  margin-top: 0.6rem;
}
/* matches */
/* ---------- AI buyer ranking ---------- */
.mrow {
  display: flex;
  gap: 0.6rem;
  align-items: center;
}
.mrow .net {
  margin-left: auto;
  text-align: right;
}
.mrow .net b {
  display: block;
  font-size: 1.05rem;
  color: var(--g);
}
.mrow .net small {
  font-size: 0.62rem;
  color: var(--mu);
}
.mdet {
  font-size: 0.68rem;
  color: var(--mu);
  margin: 0.4rem 0 0.5rem;
}
/* orders */
/* ---------- orders and tracking ---------- */
.otop {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.4rem;
}
.otop b {
  font-size: 0.92rem;
}
.stp {
  display: flex;
  margin: 0.7rem 0 0.4rem;
}
.s {
  flex: 1;
  text-align: center;
  position: relative;
  font-size: 0.56rem;
  color: var(--mu);
}
.s i {
  display: flex;
  width: 22px;
  height: 22px;
  margin: 0 auto 0.25rem;
  border-radius: 50%;
  background: var(--line);
  align-items: center;
  justify-content: center;
  font-style: normal;
  font-size: 0.62rem;
  font-weight: 700;
  position: relative;
  z-index: 1;
}
.s.d i {
  background: var(--g);
  color: #fff;
}
.s.c i {
  background: var(--amber);
  color: #3a2800;
}
.s:before {
  content: "";
  position: absolute;
  top: 10px;
  left: -50%;
  width: 100%;
  height: 2px;
  background: var(--line);
}
.s.d:before {
  background: var(--g);
}
.s:first-child:before {
  display: none;
}
.route {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.66rem;
  font-weight: 600;
  margin: 0.6rem 0 0.2rem;
}
.route .pt {
  max-width: 30%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.bar {
  flex: 1;
  height: 6px;
  background: var(--line);
  border-radius: 4px;
  position: relative;
}
.bar i {
  display: block;
  height: 100%;
  background: var(--g);
  border-radius: 4px;
  transition: width 0.35s;
}
.bar em {
  position: absolute;
  top: -11px;
  transform: translateX(-50%);
  font-style: normal;
  font-size: 1rem;
  transition: left 0.35s;
}
.pp {
  border: 2px dashed var(--g);
  border-radius: 12px;
  padding: 0.6rem 0.7rem;
  margin-top: 0.6rem;
  font-size: 0.7rem;
}
.pp div {
  display: flex;
  justify-content: space-between;
  padding: 0.22rem 0;
  border-bottom: 1px dotted var(--line);
}
.pp div:last-child {
  border: none;
}
.pp span:first-child {
  color: var(--mu);
}
.stars {
  display: flex;
  gap: 0.2rem;
  margin-top: 0.5rem;
}
.stars span {
  font-size: 1.3rem;
  cursor: pointer;
  color: var(--line);
}
.stars span.on {
  color: var(--amber);
}
/* dashboard / uses */
/* ---------- dashboard and uses ---------- */
.hb {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.7rem;
  margin: 0.45rem 0;
}
.hb span {
  width: 84px;
  color: var(--mu);
}
.hb div {
  flex: 1;
  height: 10px;
  background: var(--soft);
  border-radius: 6px;
  overflow: hidden;
}
.hb i {
  display: block;
  height: 100%;
  background: var(--g);
  border-radius: 6px;
}
.vb {
  display: flex;
  align-items: flex-end;
  gap: 0.5rem;
  height: 110px;
  margin-top: 0.6rem;
}
.vb div {
  flex: 1;
  text-align: center;
  font-size: 0.58rem;
  color: var(--mu);
}
.vb i {
  display: block;
  background: var(--amber);
  border-radius: 6px 6px 0 0;
  margin-bottom: 0.2rem;
}
.ucard {
  border-radius: 16px;
  padding: 0.8rem;
  text-align: center;
  color: #33403a;
}
.ucard .em {
  font-size: 1.8rem;
}
.ucard b {
  display: block;
  font-size: 0.8rem;
  margin: 0.25rem 0;
}
.ucard p {
  font-size: 0.66rem;
  margin: 0;
  opacity: 0.85;
}
/* chat */
/* ---------- AI chat ---------- */
.chat {
  height: 300px;
  overflow-y: auto;
  background: var(--soft);
  border-radius: 14px;
  padding: 0.7rem;
  margin-bottom: 0.6rem;
}
.msg {
  max-width: 85%;
  padding: 0.5rem 0.75rem;
  border-radius: 14px;
  margin-bottom: 0.5rem;
  font-size: 0.8rem;
  line-height: 1.4;
}
.msg.u {
  background: var(--g);
  color: #fff;
  margin-left: auto;
  border-bottom-right-radius: 3px;
}
.msg.a {
  background: var(--card);
  border: 1px solid var(--line);
  margin-right: auto;
  border-bottom-left-radius: 3px;
}
.ask {
  display: flex;
  gap: 0.5rem;
}
.ask input {
  flex: 1;
}
/* sheet + toast */
/* ---------- popup (sheet) and toast ---------- */
.sbg {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  z-index: 50;
  display: none;
}
.sbg.on {
  display: block;
}
.sheet {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: min(100%, var(--w));
  max-height: 82vh;
  overflow-y: auto;
  background: var(--bg);
  border-radius: 22px 22px 0 0;
  padding: 1rem 1rem calc(1.2rem + env(safe-area-inset-bottom, 0px));
  animation: up 0.25s ease;
}
@keyframes up {
  from {
    transform: translate(-50%, 40px);
    opacity: 0;
  }
  to {
    transform: translate(-50%, 0);
    opacity: 1;
  }
}
.sheet h4 {
  margin: 0 0 0.7rem;
  font-size: 1rem;
}
.grab {
  width: 40px;
  height: 4px;
  background: var(--line);
  border-radius: 3px;
  margin: 0 auto 0.8rem;
}
.ni {
  padding: 0.6rem 0;
  border-bottom: 1px solid var(--line);

const CROPS = {

// types of buyers used for the ranking. f = fraction of the base price they pay, h = handling cost
const BUYERS = [

// ---------- Helpers ----------
// turns a text into a number. We use it so the distance between the same two cities
// is always the same (otherwise it changes on every refresh)
function hash(s) {
  let h = 7;
  for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return h;
}
// distance in km between two places.
// Different states -> haversine formula using lat/lng of the state capital.
// Same state -> small number made from the city names (we dont have city coordinates)
function distKm(s1, c1, s2, c2) {
  c1 = (c1 || "").toLowerCase();
  c2 = (c2 || "").toLowerCase();
  if (s1 === s2) return c1 === c2 ? 6 : 12 + (hash(c1 + "|" + c2) % 34);
  const a = STATES[s1],
    b = STATES[s2],
    R = 6371,
    r = (d) => (d * Math.PI) / 180;
  const x =
    Math.sin(r(b.lat - a.lat) / 2) ** 2 +
    Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(r(b.lng - a.lng) / 2) ** 2;
  return Math.round(2 * R * Math.asin(Math.sqrt(x)));
}
// makes the <option> list of all states for the dropdowns
const stateOpts = () =>

    .map((s) => `<option>${s}</option>`)
    .join("");

// ---------- App state ----------
const S = {

};
let listings = [],

  seen = { farmer: 0, buyer: 0 },
  lid = 2000,
  oid = 1000;
const SUF = window.APP_ROLE ? window.APP_ROLE[0].toUpperCase() : ""; // keeps ids unique across the two apps
const knownN = new Set();
if (window.APP_ROLE === "buyer") {
  S.city = "Cuttack";
}
[
  ["Rice Straw", 5, "Odisha", "Cuttack", "Ramesh Sahu", 3100, 82],

  ["Husk", 2, "Haryana", "Karnal", "Baljeet Singh", 1750, 74],
  ["Rice Straw", 4, "Odisha", "Bhubaneswar", "Sunita Behera", 3050, 88],
].forEach(([crop, qty, state, city, farmer, price, quality]) =>
  listings.push({
    id: "L" + ++lid,

// demand.js
// Buyer requests ("demand board"). Farmer sees these and can offer his batch.

// ---------- Buyer demand board (what buyers want) ----------
const KINDS = {
  feed: { e: "🐄", bg: "#FDEBCB", t: "Animal-feed unit" },
  fuel: { e: "🔥", bg: "#DDEBF8", t: "Biomass plant" },
  compost: { e: "🌱", bg: "#F9DDE6", t: "Compost producer" },
  mush: { e: "🍄", bg: "#FCE9D2", t: "Mushroom farm" },
  build: { e: "🏠", bg: "#E7DDF5", t: "Eco-build panels" },
};
let demand = [],
  did = 3000;
S.bname = "Ramesh Traders";
[
  ["Konark Cattle Feeds", "feed", "Rice Straw", 8, 3300, "Odisha", "Cuttack"],
  ["Eastern Bio-Power", "fuel", "Rice Straw", 20, 2700, "Odisha", "Jharsuguda"],
  ["GreenLeaf Compost Co.", "compost", "Wheat Straw", 6, 2100, "Bihar", "Patna"],
  ["Sahyadri Mushroom Farm", "mush", "Wheat Straw", 3, 2900, "Maharashtra", "Nashik"],
  ["Karnal Pellet Works", "fuel", "Corn Stalks", 12, 2600, "Haryana", "Karnal"],
  ["AgroBoard Panels", "build", "Rice Straw", 10, 2500, "Gujarat", "Ahmedabad"],
  ["Cauvery Compost Works", "compost", "Husk", 5, 1700, "Karnataka", "Mysuru"],
].forEach(([buyer, kind, crop, qty, price, state, city]) =>
  demand.push({
    id: "D" + ++did,
    buyer,
    kind,
    crop,
    qty,
    price,
    state,
    city,
    status: "Open",
    mine: false,
    filled: 0,
  }),
);
const openDemand = () => demand.filter((d) => d.status === "Open");
const dDist = (d) => distKm(S.state, S.city, d.state, d.city);
// finds a batch of the farmer which matches what the buyer wants (same crop, still available)
function myBatchFor(d) {
  const c = listings.filter((l) => l.mine && l.status === "Available" && l.crop === d.crop);
  return c.find((l) => l.qty <= d.qty) || c[0] || null;
}
// how much the farmer will earn = price x tonnes - transport - 250 handling
// transport = distance x 45 (rupees per km, rough rate)
function offerCalc(d, l) {
  const q = Math.min(l.qty, d.qty),
    dist = dDist(d),
    tr = Math.round(dist * 45 * (0.9 + q * 0.05));
  return { q, dist, tr, net: Math.round(d.price * q) - tr - 250 };
}
// html card of ONE buyer request (this is shown in the farmer app)
function demandCard(d) {
  const k = KINDS[d.kind],
    l = myBatchFor(d),
    c = l ? offerCalc(d, l) : null;
  return `<div class="item" data-act="ddetail" data-id="${d.id}">
    <div class="thumb" style="background:${k.bg}">${k.e}</div>
    <div class="imid"><b>${esc(d.buyer)}</b><small>${k.t} · ${esc(d.city)}, ${d.state}</small>
      <div class="meta">Needs <em>${d.qty} t ${d.crop}</em> · ${inr(d.price)}/t · ${dDist(d)} km</div>
      <div class="meta" style="color:var(--mu)">${c ? `Your ${c.q} t would net <em>${inr(c.net)}</em>` : `List a ${d.crop.toLowerCase()} batch to sell here`}</div></div>
    <div class="acts"><button class="cbtn" data-act="dcall" data-id="${d.id}" aria-label="Call buyer">📞</button><button class="obtn" data-act="offer" data-id="${d.id}">Offer</button></div></div>`;
}
// html card of the buyer's OWN requirement (shown in the buyer app)
function reqCard(d) {
  const k = KINDS[d.kind];
  return `<div class="item"><div class="thumb" style="background:${k.bg}">${k.e}</div>
    <div class="imid"><b>${d.crop} · ${d.qty} t open</b><small>${k.t} · ${esc(d.city)}, ${d.state}</small>
      <div class="meta"><em>${inr(d.price)}/t</em> · ${d.filled ? d.filled + " t already offered" : "waiting for farmers"}</div></div>
    <div class="acts"><span class="pill ${d.status === "Open" ? "" : "gry"}">${d.status}</span></div></div>`;
}
// farmer offers his batch to a buyer -> creates an order.
// If the batch is bigger than the need, only the needed tonnes are sold and the rest stays listed.
function offer(id) {
  const d = demand.find((x) => x.id === id);
  if (!d || d.status !== "Open") return;
  closeSheet();
  const l = myBatchFor(d);
  if (!l) {
    S.pre = d.crop;
    go("sell");
    toast(`List your ${d.crop.toLowerCase()} first — ${d.buyer} needs ${d.qty} t`);
    return;
  }
  const c = offerCalc(d, l),
    partial = l.qty > d.qty;
  d.qty = +(d.qty - c.q).toFixed(2);
  d.filled = (d.filled || 0) + c.q;
  if (d.qty <= 0) d.status = "Filled";
  if (partial) l.qty = +(l.qty - c.q).toFixed(2);
  createOrder({
    listingId: l.id,
    partial,
    crop: l.crop,
    qty: c.q,
    farmer: l.farmer,
    city: l.city + ", " + l.state,
    price: d.price,
    net: c.net,
    dist: c.dist,
    by: "farmer",
    buyer: d.buyer,
    destCity: d.city,
    destState: d.state,
  });
}

function toast(t) {
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = t;
  $("#toasts").appendChild(el);
  setTimeout(() => {
    el.style.opacity = "0";
    el.style.transition = "opacity .3s";
    setTimeout(() => el.remove(), 300);
  }, 3200);
}
// opens the bottom popup (called "sheet") with the given html
function sheet(html) {
  $("#sheet").innerHTML = '<div class="grab"></div>' + html;
  $("#sbg").classList.add("on");
}
// closes the popup
function closeSheet() {
  $("#sbg").classList.remove("on");
}
$("#sbg").addEventListener("click", (e) => {
  if (e.target.id === "sbg") closeSheet();
});

// adds a notification. aud = who should get it: 'farmer', 'buyer' or 'both'.
// Toast is shown only if it is for the user who is using the app right now.
function notify(aud, text) {
  const n = {
    nid: (SUF || "W") + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    aud,
    text,
    time: new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" }),
  };
  notifs.unshift(n);
  knownN.add(n.nid);
  if (aud === "both" || aud === S.role)
    toast(`<b>${aud === "both" ? "Update" : aud === "farmer" ? "Farmer" : "Buyer"}:</b> ${text}`);
  updateBell();
  syncSoon();
}
const relevant = () => notifs.filter((n) => n.aud === "both" || n.aud === S.role);
// red number on the bell icon = notifications not seen yet
function updateBell() {
  const n = relevant().length - seen[S.role];
  const el = $("#bellCount");
  el.style.display = n > 0 ? "flex" : "none";
  el.textContent = n;
}

// ---------- Navigation ----------
// makes the bottom menu. Farmer gets a Sell button, buyer gets a Post button.
// The items marked 1 are only for the desktop sidebar.
function buildNav() {
  const f = S.role === "farmer";
  const items = [
    ["home", "🏠", "Home"],
    ["market", f ? "🤝" : "🛒", f ? "Buyers" : "Market"],
    [f ? "sell" : "post", "＋", f ? "Sell" : "Post"],
    ["orders", "📦", "Orders"],
    ["ai", "🤖", "Assistant"],
    ["dash", "📊", "Dashboard", 1],
    ["uses", "📚", "Uses & Info", 1],
    ["food", "🍽️", "Food & Drink", 1],
  ];
  $("#nav").innerHTML = items
    .map(([id, ic, lb, dk]) =>
      id === "sell" || id === "post"
        ? `<button class="fab" data-act="${f ? "go" : "postreq"}" ${f ? 'data-s="sell"' : ""}><span class="ic">${ic}</span><span class="lb">${f ? "Sell crop waste" : "Post requirement"}</span></button>`
        : `<button class="${dk ? "dsk" : ""}" data-act="go" data-s="${id}" data-nav="${id}"><span class="ic">${ic}</span>${lb}</button>`,
    )
    .join("");
}
// opens a screen (home, market, orders ...) and draws it
function go(s) {
  S.screen = s;
  document.querySelectorAll(".screen").forEach((x) => x.classList.toggle("on", x.id === s));
  document.querySelectorAll("#nav [data-nav]").forEach((b) => b.classList.toggle("on", b.dataset.nav === s));
  const sub = s === "dash" || s === "uses" || s === "food";
  $("#backBtn").style.display = sub ? "block" : "none";
  $("#catWrap").style.display = s === "market" ? "block" : "none";
  if (s === "home") renderHome();
  if (s === "market") renderMarket();
  if (s === "orders") renderOrders();
  if (s === "dash") renderDash();
  if (s === "sell") initSell();
  if (s === "food") renderFood();
  window.scrollTo(0, 0);
}
// switch between farmer and buyer (only works in the website, the apps have a fixed role)
function setRole(r) {
  if (window.APP_ROLE && r !== window.APP_ROLE) return;
  S.role = r;
  document.querySelectorAll("#roleSeg button").forEach((b) => b.classList.toggle("on", b.dataset.r === r));
  S.mine = false;
  buildNav();
  updateBell();
  go("home");
}
// shows the current city and state in the top left
function locText() {
  $("#locText").textContent = S.city + ", " + S.state;
}

// ---------- Home ----------
// html card of ONE batch listed by a farmer
function listingCard(l) {
  const c = CROPS[l.crop],
    d = distKm(S.state, S.city, l.state, l.city),
    own = l.mine && S.role === "farmer";
  const thumb = l.photo ? `<img src="${l.photo}" alt="">` : c.e;
  let acts;
  if (own) acts = `<span class="pill ${l.status === "Available" ? "" : "gry"}">${l.status}</span>`;
  else
    acts =
      `<button class="cbtn" data-act="call" data-id="${l.id}" aria-label="Call">📞</button>` +
      (S.role === "buyer" && l.status === "Available"
        ? `<button class="pbtn" data-act="req" data-id="${l.id}" aria-label="Request order">+</button>`
        : "");
  return `<div class="item" data-act="detail" data-id="${l.id}">
    <div class="thumb" style="background:${c.bg}">${thumb}</div>
    <div class="imid"><b>${l.crop}</b><small>${own ? "You" : l.farmer} · ${l.city}, ${l.state}</small>
      <div class="meta"><em>${inr(l.price)}/t</em> · ${l.qty} t · ${d} km · Q${l.quality}</div></div>
    <div class="acts">${acts}</div></div>`;
}
// the part of the home screen that is different for farmer and buyer:
// farmer -> buyers near him + his batches, buyer -> his requirements + new listings
function roleSections(f) {
  if (f) {
    const dem = openDemand()
        .sort((a, b) => dDist(a) - dDist(b))
        .slice(0, 3),
      mine = listings.filter((l) => l.mine);
    return `<div class="row"><h3>Buyers near you</h3><button class="link" data-act="go" data-s="market">See all</button></div>
      <p class="hi" style="margin-top:-.4rem">Who needs residue right now, and what they will pay</p>
      <div class="flist">${dem.map(demandCard).join("") || '<div class="empty">No open buyer requests yet</div>'}</div>
      <div class="row"><h3>Your batches</h3>${mine.length > 3 ? '<button class="link" data-act="mybatches">See all</button>' : ""}</div>
      <div class="flist">${mine.slice(0, 3).map(listingCard).join("") || '<div class="card empty">You have not listed anything yet.<br><button class="btn" data-act="go" data-s="sell">List your first batch</button></div>'}</div>`;
  }
  const mineD = demand.filter((d) => d.mine),
    near = listings
      .filter((l) => l.status === "Available")
      .sort((a, b) => distKm(S.state, S.city, a.state, a.city) - distKm(S.state, S.city, b.state, b.city))
      .slice(0, 3);
  return `<div class="row"><h3>Your requirements</h3><button class="link" data-act="postreq">+ Post new</button></div>
    <div class="flist">${mineD.map(reqCard).join("") || '<div class="card empty">Tell farmers what you need and they will come to you.<br><button class="btn" data-act="postreq">Post a requirement</button></div>'}</div>
    <div class="row"><h3>Fresh listings near you</h3><button class="link" data-act="go" data-s="market">See all</button></div>
    <div class="flist">${near.map(listingCard).join("") || '<div class="empty">No listings yet</div>'}</div>`;
}

// ---------- Market ----------
// draws the market screen. Farmer sees the buyer demand board, buyer sees the farmer listings.
function renderMarket() {
  const f = S.role === "farmer";
  $("#mtitle").textContent = f ? "Buyer demand board" : "Browse listings";
  $("#msub").textContent = f
    ? "Buyers who need crop residue right now — nearest first"
    : "Fresh batches from farmers across India";
  $("#mq").placeholder = f ? "Search buyer, crop, city…" : "Search straw, husk, city, farmer…";
  $("#mpost").innerHTML = f ? "" : '<button class="btn sm" data-act="postreq">+ Post requirement</button>';
  const sopts = f
    ? [
        ["distance", "Nearest first"],
        ["price", "Best price"],
        ["qty", "Biggest need"],
      ]
    : [
        ["distance", "Nearest first"],
        ["price", "Lowest price"],
        ["qty", "Most quantity"],
        ["quality", "Best quality"],
      ];
  if (!sopts.some((o) => o[0] === S.sort)) S.sort = "distance";
  $("#msort").innerHTML = sopts
    .map(([v, l]) => `<option value="${v}" ${S.sort === v ? "selected" : ""}>${l}</option>`)
    .join("");
  $("#mchips").innerHTML = ["All", ...Object.keys(CROPS)]
    .map(
      (c) =>
        `<button class="chip ${(c === "All" ? !S.filter : S.filter === c) ? "on" : ""}" data-act="chip" data-c="${c}">${c}</button>`,
    )
    .join("");
  const q = S.q.toLowerCase();
  if (f) {
    const list = openDemand().filter(
      (d) =>
        (!S.filter || d.crop === S.filter) &&
        (!q || (d.buyer + d.crop + d.city + d.state).toLowerCase().includes(q)),
    );
    const sorts = {
      distance: (a, b) => dDist(a) - dDist(b),
      price: (a, b) => b.price - a.price,
      qty: (a, b) => b.qty - a.qty,
    };
    list.sort(sorts[S.sort]);
    $("#mcount").textContent = list.length + " open requests";
    $("#mlist").innerHTML =
      list.map(demandCard).join("") || '<div class="empty">No buyer requests match.</div>';
  } else {
    const list = listings.filter(
      (l) =>
        l.status === "Available" &&
        (!S.filter || l.crop === S.filter) &&
        (!q || (l.crop + l.city + l.state + l.farmer).toLowerCase().includes(q)),
    );
    const d = (l) => distKm(S.state, S.city, l.state, l.city);
    const sorts = {
      distance: (a, b) => d(a) - d(b),
      price: (a, b) => a.price - b.price,
      qty: (a, b) => b.qty - a.qty,
      quality: (a, b) => b.quality - a.quality,
    };
    list.sort(sorts[S.sort]);
    $("#mcount").textContent = list.length + " listings";
    $("#mlist").innerHTML = list.map(listingCard).join("") || '<div class="empty">No listings match.</div>';
  }
}
$("#mq").addEventListener("input", (e) => {
  S.q = e.target.value;
  renderMarket();
});
$("#msort").addEventListener("change", (e) => {
  S.sort = e.target.value;
  renderMarket();
});

// ---------- Sell + AI analysis ----------
// fills the sell form (only first time) and sets city/state from the location
function initSell() {
  if (!$("#fCrop").options.length) {
    $("#fCrop").innerHTML = Object.keys(CROPS)
      .map((c) => `<option>${c}</option>`)
      .join("");
    $("#fState").innerHTML = stateOpts();
    $("#fState").addEventListener("change", stateNote);
    $("#fPhoto").addEventListener("change", (e) => {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = (ev) => {
        S.photo = ev.target.result;
        $("#fPrev").src = S.photo;
        $("#fPrev").style.display = "block";
      };
      r.readAsDataURL(f);
    });
  }
  $("#fState").value = S.state;
  $("#fCity").value = S.city;
  stateNote();
  if (S.pre) {
    $("#fCrop").value = S.pre;
    S.pre = null;
  }
}
// shows what the selected state normally uses crop waste for
function stateNote() {
  $("#fNote").textContent = "In " + $("#fState").value + ": " + STATES[$("#fState").value].use;
}
// NOTE: this is NOT a real AI model. It only picks a quality score and a price near the base price using random numbers.
// In the real version a CNN (transfer learning) will find the crop type from the photo and a model will predict the price.
// Net return of each buyer = revenue - transport - handling.
function analyze() {
  const crop = $("#fCrop").value,
    qty = parseFloat($("#fQty").value) || 1,
    state = $("#fState").value,
    city = $("#fCity").value || "Village",
    farmer = $("#fName").value || "Farmer";
  S.name = farmer;
  S.state = state;
  S.city = city;
  locText();
  const conf = (88 + Math.random() * 9).toFixed(1),
    quality = Math.round(72 + Math.random() * 20),
    price = Math.round(CROPS[crop].p * (0.92 + Math.random() * 0.12));
  const l = {
    id: "L" + ++lid + SUF,
    crop,
    qty,
    state,
    city,
    farmer,
    price,
    quality,
    status: "Available",
    mine: true,
    photo: S.photo,
  };
  listings.unshift(l);
  notify("buyer", `New listing near ${city}: ${qty} t ${crop} from ${farmer} at ${inr(price)}/t.`);
  S.batch = { ...l, conf, listingId: l.id };
  S.matches = BUYERS.map((b) => {
    const bp = Math.round(price * b.f),
      rev = Math.round(bp * qty),
      dist = Math.round(4 + Math.random() * 24),
      tr = Math.round(dist * 45 * (0.9 + qty * 0.05));
    return { ...b, bp, rev, dist, tr, net: rev - tr - b.h };
  });
  renderSellOut();
}
// shows the analyze result and the buyers ranked as per the goal chosen (profit, distance, ...)
function renderSellOut() {
  const b = S.batch;
  if (!b) return;
  const m = [...S.matches],
    g = S.goal;
  const sorts = {
    profit: (x, y) => y.net - x.net,
    distance: (x, y) => x.dist - y.dist,
    local: (x, y) => x.dist - y.dist,
    pickup: (x, y) => x.pr - y.pr || y.net - x.net,
    price: (x, y) => y.bp - x.bp,
  };
  m.sort(sorts[g]);
  $("#sellOut").innerHTML = `
   <div class="card"><div class="row"><b>${CROPS[b.crop].e} ${b.crop}</b><span class="pill">${b.conf}% confidence</span></div>
     <div class="stats" style="margin-top:.7rem"><div class="stat"><b>${b.quality}/100</b><small>Quality (AI est.)</small></div><div class="stat"><b>${inr(b.price)}</b><small>Price / tonne</small></div><div class="stat"><b>${inr(b.price * b.qty)}</b><small>Batch value</small></div></div>
     <p class="hi" style="margin:.6rem 0 0;font-size:.66rem">Quality &amp; price are AI estimates; final check happens at pickup. Your batch is now live in Market.</p></div>
   <h3>AI-ranked buyers</h3>
   <div class="chips">${Object.entries(GOALS)
     .map(
       ([k, v]) => `<button class="chip ${g === k ? "on" : ""}" data-act="goal" data-g="${k}">${v}</button>`,
     )
     .join("")}</div>
   ${m
     .map(
       (
         x,
         i,
       ) => `<div class="card"><div class="mrow"><div class="thumb" style="background:${CROPS[b.crop].bg};width:46px;height:46px;font-size:1.5rem">${x.e}</div>
      <div><b style="font-size:.86rem">${x.type}</b>${i === 0 ? ' <span class="pill">Recommended</span>' : ""}<small style="display:block;font-size:.66rem;color:var(--mu)">${x.dist} km · pickup ${x.pick}</small></div>
      <div class="net"><b>${inr(x.net)}</b><small>net return</small></div></div>
      <div class="mdet">${inr(x.bp)}/t → ${inr(x.rev)} revenue − ${inr(x.tr)} transport − ${inr(x.h)} handling</div>
      <button class="btn sm" data-act="book" data-t="${x.type}">Book this buyer</button></div>`,
     )
     .join("")}`;
}

// ---------- Orders ----------
// makes a new order and sends notifications to both farmer and buyer
function createOrder(o) {
  o.id = "ORD-" + ++oid + SUF;
  o.t = Date.now();
  o.batchId = "B-" + Math.floor(100000 + Math.random() * 900000);
  o.stage = 0;
  o.rating = 0;
  orders.unshift(o);
  const l = listings.find((x) => x.id === o.listingId);
  if (l && !o.partial) l.status = "Booked";
  if (o.by === "farmer") {
    notify("farmer", `Order ${o.id} placed for ${o.qty}t ${o.crop} with ${o.buyer}.`);
    notify("buyer", `New order ${o.id}: ${o.qty}t ${o.crop} from ${o.farmer}.`);
  } else {
    notify("buyer", `Order ${o.id} requested: ${o.qty}t ${o.crop} from ${o.farmer}.`);
    notify("farmer", `${o.buyer} requested order ${o.id} for your ${o.qty}t ${o.crop}.`);
  }
  go("orders");
}
// draws the orders with the 5 step tracker, the route bar and the passport after payment
function renderOrders() {
  $("#orders").innerHTML =
    '<h3>My orders &amp; live tracking</h3><div class="flist">' +
    (orders.length
      ? [...orders]
          .sort((a, b) => (b.t || 0) - (a.t || 0))
          .map((o) => {
            const pct = Math.round((o.stage / 4) * 100),
              done = o.stage === 4,
              c = CROPS[o.crop];
            const stp = STAGES.map(
              (s, i) =>
                `<div class="s ${i < o.stage ? "d" : i === o.stage ? "c" : ""}"><i>${i < o.stage ? "✓" : i + 1}</i>${s}</div>`,
            ).join("");
            const dest = o.destCity ? `${o.destCity}, ${o.destState}` : o.buyer;
            const pp = done
              ? `<div class="pp"><div><span>Batch ID</span><span>${o.batchId}</span></div><div><span>Farmer</span><span>${o.farmer}</span></div><div><span>Waste type</span><span>${o.crop}</span></div><div><span>Quantity</span><span>${o.qty} t</span></div><div><span>Buyer</span><span>${o.buyer}</span></div><div><span>Farmer net return</span><span>${inr(o.net)}</span></div><div><span>Status</span><span class="pill">Completed</span></div></div>` +
                (S.role === "buyer"
                  ? `<div class="stars" data-oid="${o.id}">${[1, 2, 3, 4, 5].map((n) => `<span data-act="rate" data-n="${n}" class="${o.rating >= n ? "on" : ""}">★</span>`).join("")}</div>`
                  : `<p class="hi" style="margin-top:.5rem">${o.rating ? "Buyer rating: <b>" + o.rating + "/5</b> ★" : "Awaiting buyer rating"}</p>`)
              : "";
            return `<div class="card"><div class="otop"><b>${c.e} ${o.id}</b><span class="pill ${done ? "" : "amb"}">${done ? "Completed" : STAGES[o.stage]}</span></div>
      <small style="color:var(--mu);font-size:.7rem">${o.qty} t ${o.crop} · ${o.buyer}</small>
      <div class="stp">${stp}</div>
      <div class="route"><span class="pt">${o.city}</span><div class="bar"><i style="width:${pct}%"></i><em style="left:${pct}%">🚚</em></div><span class="pt">${dest}</span></div>
      <small style="color:var(--mu);font-size:.66rem">${o.dist} km · ${pct}% of the journey</small>${pp}
      ${done ? "" : `<button class="btn sm" style="margin-top:.7rem" data-act="adv" data-id="${o.id}">Advance to next stage →</button>`}</div>`;
          })
          .join("")
      : '<div class="empty">No orders yet.<br>Book a buyer or request a listing to start tracking.</div>') +
    "</div>";
}
// moves an order to the next stage (Placed -> Confirmed -> Pickup -> Picked up -> Paid)
function advance(id) {
  const o = orders.find((x) => x.id === id);
  if (!o || o.stage >= 4) return;
  o.stage++;
  notify(
    "both",
    [
      "",
      `Order ${o.id} confirmed by buyer.`,
      `Pickup scheduled for ${o.id}.`,
      `${o.id} picked up — in transit.`,
      `Payment completed for ${o.id}. Waste-to-Value Passport issued.`,
    ][o.stage],
  );
  if (o.stage === 4 && !o.partial) {
    const l = listings.find((x) => x.id === o.listingId);
    if (l) l.status = "Sold";
  }
  renderOrders();
}

// ---------- Dashboard / Uses ----------
// draws the dashboard numbers and bars
function renderDash() {
  const f = S.role === "farmer",
    comp = orders.filter((o) => o.stage === 4),
    rated = comp.filter((o) => o.rating);
  const wallet = comp.reduce((s, o) => s + o.net, 0),
    spent = comp.filter((o) => o.by === "buyer").reduce((s, o) => s + o.price * o.qty, 0);
  const avg = rated.length ? (rated.reduce((s, o) => s + o.rating, 0) / rated.length).toFixed(1) : "–";
  const st = f
    ? [
        [inr(wallet), "Wallet"],
        [listings.filter((l) => l.mine).length, "My listings"],
        [avg, "Avg rating"],
      ]
    : [
        [orders.length, "Orders"],
        [inr(spent), "Spent"],
        [listings.filter((l) => l.status === "Available").length, "Available"],
      ];
  const by = Object.keys(CROPS).map((c) => [
    c,
    listings.filter((l) => l.crop === c && l.status === "Available").reduce((s, l) => s + l.qty, 0),
  ]);
  const mx = Math.max(1, ...by.map((x) => x[1])),
    wk = [6, 9, 8, 14, 17, 21];

// ---------- AI assistant ----------
// adds one message in the chat window
function addMsg(r, h) {
  const d = document.createElement("div");
  d.className = "msg " + r;
  d.innerHTML = h;
  $("#chat").appendChild(d);
  $("#chat").scrollTop = 1e6;
}
// NOTE: simple keyword matching, not a real AI. It checks the words of the question (animal, house, fuel ...)
// and gives the matching answer from the USES list. A real LLM can be connected later.
function answer(q) {
  q = q.toLowerCase();
  for (const s in STATES) if (q.includes(s.toLowerCase())) return `📍 <b>${s}:</b> ${STATES[s].use}`;
  const m = USES.filter((u) => u.k.some((k) => q.includes(k)));
  if (m.length) return m.map((u) => `${u.e} <b>${u.t}:</b> ${u.x}`).join("<br><br>");
  if (/use|product|waste|straw|husk|stalk/.test(q))
    return (
      "This crop residue can be used for:<br><br>" +
      USES.map((u) => `${u.e} <b>${u.t}</b> — ${u.x}`).join("<br><br>")
    );
  return "I'm a simple demo assistant — ask about animal feed, house building, biomass fuel, compost, mushrooms, biogas, or a state's typical use.";
}
// user asks a question in the chat
function ask(t) {
  t = (t || "").trim();
  if (!t) return;
  addMsg("u", t);
  $("#aq").value = "";
  setTimeout(() => addMsg("a", answer(t)), 350);
}

const esc = (s) =>
  String(s == null ? "" : s).replace(
    /[&<>"']/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
  );
// Is the backend (server.py) available? On a plain static host this stays false and sample data is used.
const foodReady = fetch("/api/food/health")
  .then((r) => (r.ok ? r.json() : null))
  .then((j) => !!(j && j.ok))
  .catch(() => false);
let foodTok = 0;
// asks our backend for live data. Returns null if the backend is not there (then we show sample data)
async function loadFoodLive(name) {
  if (!(await foodReady)) return null;
  try {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), 20000);
    const r = await fetch("/api/food/ideas?item=" + encodeURIComponent(name), { signal: c.signal });
    clearTimeout(t);
    return r.ok ? await r.json() : null;
  } catch (e) {
    return null;
  }
}
// draws the 3 cards (recipes, flavours, drinks). Every card has a badge: Live or Sample

  const names = Object.keys(FOOD_SAMPLE);

    .map(
      (n) =>
        `<button class="chip ${S.food === n ? "on" : ""}" data-act="food" data-f="${n}">${FOOD_SAMPLE[n].e} ${n}</button>`,
    )
    .join("");
  const tok = ++foodTok;
  $("#fOut").innerHTML = '<div class="empty">Loading ideas…</div>';
  const live = await loadFoodLive(S.food);
  if (tok !== foodTok) return;
  const f = FOOD_SAMPLE[S.food],
    ok = (k) => !!(live && live[k] && live[k].source === "live");
  const badge = (b) => `<span class="pill ${b ? "" : "gry"}">${b ? "Live" : "Sample"}</span>`;
  const li = (a) => `<ul class="fl">${a.map((x) => `<li>${x}</li>`).join("")}</ul>`;
  const why = (k) =>
    live && live[k] && live[k].error && !ok(k)
      ? `<div class="api">${esc(live[k].error)} — showing sample</div>`
      : "";
  const recOk = ok("recipes") && live.recipes.items.length,
    flaOk = ok("flavor"),
    driOk = ok("drinks") && live.drinks.items.length;
  const recipes = recOk
    ? li(
        live.recipes.items.map(
          (r) =>
            esc(r.title) +
            (r.region
              ? ` <small style="color:var(--mu)">· ${esc(r.region)}${r.indian ? " · Indian" : ""}</small>`
              : ""),
        ),
      )
    : li(f.r);
  const flavor = flaOk
    ? `<p class="hi" style="margin:.35rem 0 0">${esc(live.flavor.entity)} · ${live.flavor.molecule_count} flavour molecules</p>` +
      (live.flavor.profiles.length
        ? `<div class="tags">${live.flavor.profiles.map((p) => `<span>${esc(p)}</span>`).join("")}</div>`
        : "") +
      (live.flavor.pairings.length
        ? `<p class="hi" style="margin:.3rem 0 0">Pairs well with:</p>${li(live.flavor.pairings.map(esc))}`
        : "")
    : li(f.p);
  const drinks = driOk
    ? li(
        live.drinks.items.map(
          (d) => esc(d.name) + (d.via ? ` <small style="color:var(--mu)">· with ${esc(d.via)}</small>` : ""),
        ),
      )
    : li(f.d);
  const anyLive = recOk || flaOk || driOk;
  $("#fOut").innerHTML = `<div class="flist">
    <div class="card"><b>🍳 Recipe ideas</b> ${badge(recOk)}${recipes}<div class="api">RecipeDB · GET /recipe2-api/recipe-bytitle/recipeByTitle, then /recipe2-api/recipes_cuisine/cuisine/{region}</div>${why("recipes")}</div>
    <div class="card"><b>🧪 Flavour pairings</b> ${badge(flaOk)}${flavor}<div class="api">FlavorDB · GET /flavordb/entities/by-entity-alias-readable, then /flavordb/entities/by-name-and-category</div>${why("flavor")}</div>
    <div class="card"><b>🍹 Drink ideas (no alcohol)</b> ${badge(driOk)}${drinks}<div class="api">CocktailDB · non-alcoholic drinks that share a pairing ingredient</div>${why("drinks")}</div></div>
    <div class="note">${anyLive ? "Live results come from the databases through the backend, so the API key never reaches the browser." : "Sample ideas shown. Run the backend (see README) to fetch live RecipeDB, FlavorDB and CocktailDB results."} Only clean, fresh, food-grade by-products qualify — never straw, husk, burnt, mouldy or pesticide-contaminated material.</div>`;
}

// sync.js
// Keeps the Farmer app and the Buyer app in sync using our backend (/api/world/sync).
// If there is no backend nothing happens and each app works alone with its own sample data.

// ---------- Live sync between the Farmer app and the Buyer app (active only when the backend is running) ----------
const SYNC = { ok: false, since: 0, snap: {}, sent: new Set(), busy: false, timer: null, fail: 0 };
const sig = (o) => JSON.stringify(o, (k, v) => (k === "v" || k === "_rev" ? undefined : v));
const COLS = () => ({ listings, demand, orders });
// sync again after a short wait (called after something changes)
function syncSoon() {
  if (SYNC.ok) {
    clearTimeout(SYNC.timer);
    SYNC.timer = setTimeout(syncNow, 150);
  }
}
// draws the current screen again after new data came from the server
function rerender() {
  const s = S.screen;
  if (s === "home") renderHome();
  else if (s === "market") renderMarket();
  else if (s === "orders") renderOrders();
  else if (s === "dash") renderDash();
}
// after a restart, move the id counters ahead of the ids already on the server so new ids dont repeat
function rebase() {
  const mx = (arr, re) =>
    arr.reduce((m, x) => {
      const k = re.exec(x.id);
      return k ? Math.max(m, +k[1]) : m;
    }, 0);
  lid = Math.max(lid, mx(listings, /^L(\d+)/));
  did = Math.max(did, mx(demand, /^D(\d+)/));
  oid = Math.max(oid, mx(orders, /^ORD-(\d+)/));
}
// 1) find items that changed on this phone  2) send them  3) take the newer items that came back
async function syncNow() {
  if (SYNC.busy || !SYNC.ok) return;
  SYNC.busy = true;
  try {
    const changes = {};
    for (const [name, arr] of Object.entries(COLS())) {
      changes[name] = [];
      for (const it of arr) {
        if (SYNC.snap[name + it.id] !== sig(it)) {
          it.v = (it.v || 0) + 1;
          changes[name].push(it);
        }
      }
    }
    const fresh = notifs.filter((n) => !SYNC.sent.has(n.nid));
    const r = await fetch("/api/world/sync", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ since: SYNC.since, changes, notifs: fresh }),
    });
    if (!r.ok) throw new Error("sync " + r.status);
    const w = await r.json();
    for (const [name, arr] of Object.entries(changes))
      for (const it of arr) SYNC.snap[name + it.id] = sig(it);
    fresh.forEach((n) => SYNC.sent.add(n.nid));
    let changed = false;
    for (const [name, arr] of Object.entries(COLS())) {
      for (const rit of w[name] || []) {
        const i = arr.findIndex((x) => x.id === rit.id),
          local = arr[i];
        if (local && (local.v || 0) > (rit.v || 0)) continue; // newer local edit not sent yet
        if (local && sig(local) === sig(rit)) {
          local.v = rit.v;
          SYNC.snap[name + rit.id] = sig(rit);
          continue;
        }
        if (i >= 0) arr[i] = rit;
        else arr.push(rit);
        SYNC.snap[name + rit.id] = sig(rit);
        changed = true;
      }
    }
    for (const n of w.notifs || []) {
      SYNC.sent.add(n.nid);
      if (knownN.has(n.nid)) continue;
      knownN.add(n.nid);
      notifs.unshift(n);
      changed = true;
      if (n.aud === "both" || n.aud === S.role)
        toast(`<b>${n.aud === "both" ? "Update" : n.aud === "farmer" ? "Farmer" : "Buyer"}:</b> ${n.text}`);
    }
    SYNC.since = w.rev;
    SYNC.fail = 0;
    rebase();
    if (changed) {
      updateBell();
      rerender();
    }
  } catch (e) {
    if (++SYNC.fail > 3) SYNC.ok = false;
  } finally {
    SYNC.busy = false;
  }
}
// checks if the backend is there, if yes starts syncing every 2.5 seconds
async function initSync() {
  try {
    const r = await fetch("/api/world/health");
    if (!r.ok) return;
    const j = await r.json();
    if (!j.ok) return;
    SYNC.ok = true;
  } catch (e) {
    return;
  }
  await syncNow();
  rerender();
  setInterval(() => {
    if (SYNC.ok) syncNow();
  }, 2500);
}
